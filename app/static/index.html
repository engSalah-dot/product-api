<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: .5rem; margin-bottom: .5rem; }
    form input[name=description] { grid-column: 1 / -1; }
    form button { grid-column: 1 / -1; }
    input, button { padding: .5rem; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    #error { color: #b00020; min-height: 1.5rem; }
    td button { margin-right: .25rem; }
  </style>
</head>
<body>
  <h1>Products</h1>

  <form id="product-form">
    <input name="name" placeholder="Name" required>
    <input name="price" type="number" step="0.01" placeholder="Price" required>
    <input name="stock" type="number" placeholder="Stock" value="0">
    <input name="description" placeholder="Description (optional)">
    <button type="submit">Add product</button>
  </form>

  <div id="error"></div>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const API = "/api/v1/products";
    const rows = document.getElementById("rows");
    const errorBox = document.getElementById("error");

    // دالة واحدة لكل الطلبات: بتبعت، وتتأكد من النجاح، وترمي error برسالة واضحة
    async function request(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        const detail = typeof body.detail === "string"
          ? body.detail
          : JSON.stringify(body.detail);
        throw new Error(`${res.status}: ${detail}`);
      }
      return res.status === 204 ? null : res.json(); // 204 = مفيش body
    }

    function showError(err) { errorBox.textContent = err ? err.message : ""; }

    async function loadProducts() {
      try {
        const products = await request(`${API}?limit=100`);
        rows.replaceChildren(...products.map(renderRow));
        showError(null);
      } catch (err) { showError(err); }
    }

    function renderRow(p) {
      const tr = document.createElement("tr");
      for (const value of [p.id, p.name, p.price, p.stock]) {
        const td = document.createElement("td");
        td.textContent = value;      // textContent مش innerHTML (شرح تحت)
        tr.appendChild(td);
      }
      const actions = document.createElement("td");

      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit price";
      editBtn.onclick = () => editPrice(p);

      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.onclick = () => deleteProduct(p.id);

      actions.append(editBtn, delBtn);
      tr.appendChild(actions);
      return tr;
    }

    async function editPrice(p) {
      const input = prompt(`New price for "${p.name}":`, p.price);
      if (input === null) return;               // المستخدم ضغط Cancel
      try {
        await request(`${API}/${p.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ price: Number(input) }),
        });
        loadProducts();
      } catch (err) { showError(err); }
    }

    async function deleteProduct(id) {
      if (!confirm(`Delete product ${id}?`)) return;
      try {
        await request(`${API}/${id}`, { method: "DELETE" });
        loadProducts();
      } catch (err) { showError(err); }
    }

    document.getElementById("product-form").addEventListener("submit", async (e) => {
      e.preventDefault();                       // امنع الصفحة من الـ reload
      const form = e.target;
      const data = {
        name: form.name.value,
        price: Number(form.price.value),
        stock: Number(form.stock.value),
        description: form.description.value || null,
      };
      try {
        await request(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        form.reset();
        loadProducts();
      } catch (err) { showError(err); }
    });

    loadProducts();
  </script>
</body>
</html>
